{% extends "base.html" %}
{% block title %}Edit Job | JobTrack{% endblock %}
{% block content %}
<div class="form-card">
    <h2 class="fw-bold mb-1">Edit application</h2>
    <p class="text-muted mb-4">Update your application information.</p>
    <form method="POST">
        {% include "_job_fields.html" %}
        <button class="btn btn-primary">Update application</button>
        <a href="{{ url_for('applications') }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
