{% extends "base.html" %}
{% block title %}Register | JobTrack{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="brand-mark">JT</div>
            <h2 class="fw-bold mt-3">Create your account</h2>
            <p class="text-muted">Start organizing your job search.</p>
        </div>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Full name</label>
                <input type="text" name="name" class="form-control" placeholder="Your name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" minlength="6" placeholder="At least 6 characters" required>
            </div>
            <button class="btn btn-primary btn-lg w-100">Create account</button>
        </form>
        <p class="text-center mt-4 mb-0">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
    </div>
</div>
{% endblock %}
