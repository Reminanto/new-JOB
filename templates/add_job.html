{% extends "base.html" %}
{% block title %}Add Job | JobTrack{% endblock %}
{% block content %}
<div class="form-card">
    <h2 class="fw-bold mb-1">Add job application</h2>
    <p class="text-muted mb-4">Enter the details of a job you applied for.</p>
    <form method="POST">
        {% include "_job_fields.html" %}
        <button class="btn btn-primary">Save application</button>
        <a href="{{ url_for('applications') }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
