{% extends "base.html" %}
{% block title %}Login | JobTrack{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="brand-mark">JT</div>
            <h2 class="fw-bold mt-3">Welcome back</h2>
            <p class="text-muted">Log in to manage your job applications.</p>
        </div>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" name="email" class="form-control form-control-lg" placeholder="you@example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control form-control-lg" placeholder="Enter your password" required>
            </div>
            <button class="btn btn-primary btn-lg w-100">Login</button>
        </form>
        <p class="text-center mt-4 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div>
</div>
{% endblock %}
